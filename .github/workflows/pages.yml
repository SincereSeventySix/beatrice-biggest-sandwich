name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES_BASE: /beatrice-biggest-sandwich/
          VITE_AUTH_ENABLED: "false"
          VITE_GROK_EXTENSIONS: "0"
      - name: Snapshot the built site
        env:
          GITHUB_PAGES_BASE: /beatrice-biggest-sandwich/
          VITE_AUTH_ENABLED: "false"
          VITE_GROK_EXTENSIONS: "0"
        run: |
          node scripts/preview.mjs restart
          mkdir -p site
          cp -a .vercel/output/static/. site/
          curl -fsS http://127.0.0.1:8081/beatrice-biggest-sandwich/ -o site/index.html
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
